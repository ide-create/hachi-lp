<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0A05">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hachi Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Hachi Life Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0A05;--bg2:#171107;--card:#1D150C;--card2:#251B0F;
  --line:#372A17;--line2:#4E3C1F;
  --gold:#B98A2F;--honey:#E9A13B;--honey2:#F2C14E;
  --tx:#F4EBD9;--mut:#A08F72;--mut2:#776749;
  --grn:#6FCB8F;--red:#E26A4D;
  --disp:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:14px;line-height:1.7;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  background-image:
    radial-gradient(90% 46% at 50% -8%, rgba(233,161,59,.14) 0%, rgba(233,161,59,0) 70%),
    linear-gradient(180deg,#171107 0%,#0F0A05 320px);
  background-repeat:no-repeat}
.hide{display:none!important}
.wrap{max-width:430px;margin:0 auto;padding:0 18px}

/* ===== login ===== */
#login{max-width:360px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 24px 60px;text-align:center}
#login .appicon{width:96px;height:96px;border-radius:26px;margin:0 auto 20px;display:block;
  box-shadow:0 14px 38px rgba(0,0,0,.6),0 0 0 1px var(--line);}
#login h1{font-family:var(--disp);font-weight:600;font-size:34px;letter-spacing:2px;margin:0;color:var(--honey2)}
#login .sub{color:var(--mut);font-size:11px;letter-spacing:3px;font-weight:700;margin:6px 0 34px}
#login input{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:14px;font-size:16px;
  margin-bottom:12px;background:var(--card);color:var(--tx);outline:none;font-family:inherit}
#login input::placeholder{color:var(--mut2)}
#login input:focus{border-color:var(--gold)}
#login button{width:100%;padding:17px;border:none;border-radius:999px;margin-top:8px;
  background:linear-gradient(135deg,var(--honey2),var(--honey) 55%,var(--gold));
  color:#23170A;font-size:15px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:inherit;
  box-shadow:0 12px 30px rgba(233,161,59,.28)}
#loginErr{color:var(--red);font-size:12.5px;min-height:20px;margin-top:12px}

/* ===== header ===== */
.head{display:flex;align-items:center;gap:11px;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
.head img{width:38px;height:38px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.head .brand{font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:1.5px;color:var(--honey2);line-height:1.1}
.head .brand small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:8.5px;font-weight:900;letter-spacing:4px;color:var(--mut)}
.head .sp{flex:1}
.head .dt{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:1.5px;text-align:right}
.hi{font-size:22px;font-weight:900;margin:4px 0 2px}

/* ===== cards ===== */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:20px;padding:16px 18px;margin-top:14px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.lb{font-size:9.5px;font-weight:900;letter-spacing:2.5px;color:var(--gold)}
.visit{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.visit .fam{font-weight:900;font-size:17.5px;color:var(--tx)}
.visit .loc{font-size:11.5px;color:var(--mut)}
.timechip{background:rgba(242,193,78,.08);border:1px solid var(--line2);color:var(--honey2);
  font-size:11.5px;font-weight:900;padding:7px 12px;border-radius:10px;white-space:nowrap;text-align:center}
.steps{display:flex;gap:5px;margin-top:15px}
.stp{flex:1;text-align:center;font-size:9.5px;font-weight:700;color:var(--mut2);padding-top:7px}
.stp::before{content:"";display:block;height:4px;border-radius:99px;background:#2C2112;margin-bottom:6px}
.stp.done{color:var(--gold)}.stp.done::before{background:linear-gradient(90deg,var(--gold),var(--honey))}
.stp.now{color:var(--honey2)}.stp.now::before{background:var(--honey2);box-shadow:0 0 10px rgba(242,193,78,.5)}

/* ===== big button ===== */
.big{margin-top:16px;border:none;width:100%;border-radius:22px;padding:20px 22px;cursor:pointer;text-align:left;font-family:inherit;
  background:linear-gradient(135deg,var(--honey2) 0%,var(--honey) 55%,var(--gold) 100%);
  box-shadow:0 14px 34px rgba(233,161,59,.3),inset 0 1px 0 rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:space-between}
.big:active{transform:scale(.98)}
.big:disabled{opacity:.4;box-shadow:none}
.big .t1{font-size:10px;font-weight:900;letter-spacing:3px;color:#6E4E0A}
.big .t2{font-size:22px;font-weight:900;color:#1E1304;margin-top:3px}
.big .play{width:52px;height:52px;border-radius:50%;background:#1E1304;display:flex;align-items:center;justify-content:center;flex:none;color:var(--honey2);font-size:19px}
.subrow{display:flex;gap:10px;margin-top:12px}
.sb{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px 0;text-align:center;
  font-weight:900;font-size:12.5px;color:var(--tx);cursor:pointer;font-family:inherit}
.sb:disabled{opacity:.3}
.elapsed{margin-top:13px;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:inset 0 0 36px rgba(233,161,59,.06)}
.elapsed .l{font-size:9px;font-weight:900;letter-spacing:2.5px;color:var(--gold)}
.elapsed .v{font-family:var(--disp);font-size:34px;font-weight:600;color:var(--honey2);font-variant-numeric:tabular-nums;line-height:1.1}
.elapsed .st2{font-size:11px;font-weight:900;color:var(--mut)}

/* ===== tasks ===== */
.task .row{display:flex;align-items:center;gap:11px;padding:10px 0;font-weight:700;font-size:13.5px;color:var(--tx);cursor:pointer;user-select:none;border-bottom:1px solid rgba(55,42,23,.5)}
.task .row:last-of-type{border-bottom:none}
.ck{width:23px;height:23px;border-radius:8px;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:transparent}
.row.on .ck{background:linear-gradient(135deg,var(--honey2),var(--honey));border-color:var(--honey);color:#1E1304}
.row.on{color:var(--mut2);text-decoration:line-through}
.photo{display:flex;align-items:center;gap:10px;margin-top:12px;background:rgba(242,193,78,.06);border:1.5px dashed var(--line2);border-radius:13px;padding:13px 14px;font-weight:700;font-size:12.5px;color:var(--honey2);cursor:pointer}
.photo.on{border-style:solid;border-color:#3E6B4D;background:rgba(111,203,143,.08);color:var(--grn)}
.photo img{width:44px;height:44px;object-fit:cover;border-radius:9px}
.donebox{margin-top:14px;background:rgba(111,203,143,.07);border:1px solid #35543F;border-radius:20px;padding:20px;text-align:center}
.donebox b{display:block;font-size:16px;margin-top:4px;color:var(--grn)}
.donebox p{margin:6px 0 0;font-size:12px;color:var(--mut)}

/* ===== chat (LINE style) ===== */
#vChat{display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 0 12px;border-bottom:1px solid var(--line)}
.chathead img{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--honey2),var(--gold));padding:4px;box-sizing:border-box}
.chathead .n{font-weight:900;font-size:14.5px}
.chathead .s{font-size:10.5px;color:var(--mut)}
#chatBox{display:flex;flex-direction:column;gap:3px;padding:16px 0 12px;min-height:46vh}
.mrow{display:flex;align-items:flex-end;gap:7px;margin-top:9px;max-width:100%}
.mrow.me{justify-content:flex-end}
.mrow .avy{width:30px;height:30px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--honey2),var(--gold));padding:3px;box-sizing:border-box;align-self:flex-start}
.bub{max-width:72%;padding:10px 14px;font-size:13.5px;line-height:1.65;word-break:break-word;position:relative}
.mrow.them .bub{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:4px 18px 18px 18px}
.mrow.me .bub{background:linear-gradient(135deg,var(--honey2),var(--honey));color:#211503;font-weight:500;border-radius:18px 4px 18px 18px}
.tm{font-size:9.5px;color:var(--mut2);flex:none;padding-bottom:2px}
.sender{font-size:10px;color:var(--mut);margin:0 0 3px 44px}
.trrow{margin:5px 0 0 44px}
.tr{display:inline-block;font-size:10.5px;font-weight:900;color:var(--honey2);text-decoration:none;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;background:rgba(242,193,78,.07)}
.chatbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(15,10,5,0),rgba(15,10,5,.92) 30%);padding:14px 16px 10px;display:flex;gap:9px}
.chatbar .inwrap{flex:1;display:flex;background:var(--card);border:1px solid var(--line2);border-radius:999px}
.chatbar input{flex:1;padding:13px 18px;border:none;border-radius:999px;font-size:15px;background:transparent;color:var(--tx);outline:none;font-family:inherit}
.chatbar input::placeholder{color:var(--mut2)}
.chatbar button{border:none;border-radius:50%;width:48px;height:48px;flex:none;
  background:linear-gradient(135deg,var(--honey2),var(--gold));color:#1E1304;font-size:18px;cursor:pointer;
  box-shadow:0 8px 20px rgba(233,161,59,.3)}

/* ===== tabs ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;
  background:rgba(23,16,8,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;padding:10px 6px calc(14px + env(safe-area-inset-bottom))}
.nav button{flex:1;text-align:center;font-size:9.5px;font-weight:900;color:var(--mut2);letter-spacing:1.5px;border:none;background:none;cursor:pointer;font-family:inherit;position:relative}
.nav .ic{display:block;margin:0 auto 4px;width:23px;height:23px;stroke:var(--mut2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--honey2)}
.nav button.on .ic{stroke:var(--honey2);filter:drop-shadow(0 0 7px rgba(242,193,78,.45))}
.badge{position:absolute;top:-4px;right:calc(50% - 22px);min-width:17px;background:var(--red);color:#fff;border-radius:99px;font-size:9px;font-weight:900;padding:2px 5px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--honey2);color:#1E1304;font-weight:900;font-size:13px;padding:12px 22px;border-radius:999px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:99;transition:opacity .3s;white-space:nowrap}
.out{margin-top:18px;text-align:center}
.out button{background:none;border:none;color:var(--mut2);font-size:11.5px;text-decoration:underline;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <img class="appicon" src="icons/icon-192.png" alt="">
  <h1>Hachi Life</h1>
  <p class="sub">STAFF APP</p>
  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">SIGN IN</button>
  <p id="loginErr"></p>
</div>

<!-- APP -->
<div id="app" class="hide">
<div class="wrap">
  <div class="head">
    <img src="icons/mark-160.png" alt="">
    <div class="brand">Hachi Life<small>STAFF APP</small></div>
    <div class="sp"></div>
    <div class="dt" id="dt"></div>
  </div>

  <!-- HOME -->
  <div id="vHome">
    <div class="hi" id="hi">Hi 👋</div>
    <div class="card">
      <div class="lb">TODAY'S FAMILY</div>
      <div class="visit">
        <div><div class="fam" id="cName">—</div><div class="loc" id="cArea"></div></div>
        <div class="timechip" id="cTime">—</div>
      </div>
      <div class="steps" id="steps">
        <div class="stp" data-s="0">Check In</div><div class="stp" data-s="1">Work</div><div class="stp" data-s="2">Tasks</div><div class="stp" data-s="3">Report</div><div class="stp" data-s="4">Done</div>
      </div>
    </div>

    <button class="big" id="bigBtn"><span><span class="t1" id="bigT1">READY</span><span class="t2" id="bigT2" style="display:block">Check In</span></span><span class="play">▶</span></button>
    <div class="subrow">
      <button class="sb" id="btnBreak" disabled>☕ Break</button>
      <button class="sb" id="btnFinish" disabled>⏹ Finish</button>
    </div>

    <div class="elapsed hide" id="elapsed">
      <div><div class="l">WORKING TIME</div><div class="v" id="elV">0:00</div></div>
      <div class="st2" id="elS">● On duty</div>
    </div>

    <div class="card task hide" id="taskCard">
      <div class="lb">FAMILY BOOK ・ TODAY'S TASKS</div>
      <div id="taskList"></div>
      <label class="photo hide" id="photoBtn">
        <input type="file" accept="image/*" capture="environment" id="photoIn" style="display:none">
        <span id="photoIc">📷</span><span id="photoT">Take photo of locked door</span>
      </label>
      <button class="big hide" id="submitBtn" style="margin-top:12px;padding:16px 20px"><span><span class="t1">ALL DONE?</span><span class="t2" style="display:block;font-size:18px">Submit Report</span></span><span class="play">✓</span></button>
    </div>

    <div class="donebox hide" id="doneBox">
      <div style="font-size:28px">🎉</div><b>Great work today!</b>
      <p id="doneSum"></p>
    </div>
    <div class="out"><button id="logout">Sign out</button></div>
  </div>

  <!-- CHAT -->
  <div id="vChat" class="hide">
    <div class="chathead">
      <img src="icons/mark-160.png" alt="">
      <div><div class="n">Hachi Life Office</div><div class="s">English is OK! We reply in English 🐝</div></div>
    </div>
    <div id="chatBox"></div>
  </div>
</div>

<div class="chatbar hide" id="chatbar">
  <div class="inwrap"><input id="msgIn" placeholder="Message..."></div>
  <button id="sendBtn">➤</button>
</div>

<div class="nav">
  <button class="on" data-v="Home">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
    HOME</button>
  <button data-v="Chat">
    <svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5c0 4.14-4.03 7.5-9 7.5-1.03 0-2.02-.14-2.94-.41L4 20l1.28-3.42C3.86 15.3 3 13.49 3 11.5 3 7.36 7.03 4 12 4s9 3.36 9 7.5Z"/></svg>
    CHAT<span class="badge hide" id="unread">0</span></button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
let me=null, meDoc=null, punches=[], tasksState=[], photoData=null, reportDone=false, timer=null, lastChatSeen=0;
const $=id=>document.getElementById(id);

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),400)},1800)}

/* ---------- login ---------- */
$('loginBtn').onclick=async()=>{
  $('loginErr').textContent='';
  try{ await auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value); }
  catch(e){ $('loginErr').textContent='Sign in failed. Check email / password.'; }
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});

auth.onAuthStateChanged(async u=>{
  if(!u){ $('login').classList.remove('hide'); $('app').classList.add('hide'); return; }
  me=u;
  const snap=await db.collection('staff').doc(u.uid).get();
  if(!snap.exists){ $('loginErr').textContent='No staff profile. Contact the office.'; auth.signOut(); return; }
  meDoc=snap.data();
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  boot();
});
$('logout').onclick=()=>auth.signOut();

/* ---------- boot ---------- */
function boot(){
  const n=new Date();
  $('dt').textContent=['SUN','MON','TUE','WED','THU','FRI','SAT'][n.getDay()]+', '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][n.getMonth()]+' '+n.getDate();
  $('hi').textContent='Hi, '+(meDoc.name||'Staff')+' 👋';
  $('cName').textContent=meDoc.clientName||'No assignment';
  $('cArea').textContent=meDoc.clientArea||'';
  $('cTime').textContent=meDoc.schedule||'';
  tasksState=(meDoc.tasks||[]).map(t=>({t,done:false}));
  renderTasks();
  // 今日の打刻を購読
  db.collection('punches').where('uid','==',me.uid).where('day','==',todayStr())
    .onSnapshot(s=>{punches=s.docs.map(d=>d.data());render()},e=>console.error(e));
  // 今日の日報があるか
  db.collection('reports').doc(todayStr()+'_'+me.uid).onSnapshot(s=>{
    reportDone=s.exists; render();
  });
  // chat購読
  db.collection('messages').where('uid','==',me.uid)
    .onSnapshot(s=>{renderChat(s.docs.map(d=>d.data()))},e=>console.error(e));
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{const c=calcDay(punches);if(c.state==='working'||c.state==='break'){$('elV').textContent=Math.floor(c.workedMin/60)+':'+String(c.workedMin%60).padStart(2,'0')}},20000);
}

/* ---------- punch ---------- */
let punchLock=false; // 連打防止
async function punch(type){
  if(punchLock)return; punchLock=true; setTimeout(()=>{punchLock=false},2000);
  let geo=null;
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000,maximumAge:60000}));
    geo={lat:pos.coords.latitude,lng:pos.coords.longitude};
  }catch(e){}
  await db.collection('punches').add({
    uid:me.uid,name:meDoc.name||'',day:todayStr(),type,at:TS(),
    lat:geo?geo.lat:null,lng:geo?geo.lng:null
  });
}
$('bigBtn').onclick=async()=>{
  const c=calcDay(punches);
  try{
    if(reportDone)return;
    if(c.state==='none'){await punch('in');toast('Checked in! Have a good day 🐝');}
    else if(c.state==='break'){await punch('be');toast('Back to work!');}
    else if(c.state==='done'){ /* submit flow handled by submitBtn */ }
  }catch(e){toast('Error. Try again.');console.error(e)}
};
$('btnBreak').onclick=()=>punch('bs').then(()=>toast('Break ☕')).catch(()=>toast('Error'));
$('btnFinish').onclick=async()=>{
  const c=calcDay(punches);
  if(c.state==='none'||c.state==='done')return; // 未出勤・退勤済みは無視
  if(c.state==='break'){punchLock=false;await punch('be');}
  punchLock=false;await punch('out');toast('Finished! Please submit your report.');
};
/* ---------- tasks / photo / report ---------- */
function renderTasks(){
  $('taskList').innerHTML=tasksState.map((x,i)=>`<div class="row ${x.done?'on':''}" data-i="${i}"><span class="ck">✓</span>${x.t}</div>`).join('')||'<div style="color:var(--mut);font-size:12px">No tasks set. Ask the office.</div>';
  document.querySelectorAll('#taskList .row').forEach(r=>r.onclick=()=>{tasksState[+r.dataset.i].done=!tasksState[+r.dataset.i].done;renderTasks();render()});
}
$('photoIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');
    const sc=Math.min(1,900/Math.max(img.width,img.height));
    cv.width=img.width*sc;cv.height=img.height*sc;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    photoData=cv.toDataURL('image/jpeg',0.65);
    if(photoData.length>900000){photoData=cv.toDataURL('image/jpeg',0.4);}
    $('photoBtn').classList.add('on');$('photoIc').innerHTML='<img src="'+photoData+'">';$('photoT').textContent='Lock photo ready ✓';
    render();
  };
  img.src=URL.createObjectURL(f);
};
$('submitBtn').onclick=async()=>{
  const c=calcDay(punches);
  const tasksObj={};tasksState.forEach((x,i)=>tasksObj[i]=x.done);
  try{
    await db.collection('reports').doc(todayStr()+'_'+me.uid).set({
      uid:me.uid,name:meDoc.name||'',day:todayStr(),client:meDoc.clientName||'',
      tasks:(meDoc.tasks||[]),tasksDone:tasksObj,photo:photoData||null,
      workedMin:c.workedMin,breakMin:c.breakMin,submittedAt:TS()
    });
    toast('Report sent! 🎉');
  }catch(e){toast('Error sending report');console.error(e)}
};

/* ---------- render ---------- */
function render(){
  const c=calcDay(punches);
  let phase=0;
  if(c.state==='working')phase=tasksState.some(x=>x.done)?2:1;
  if(c.state==='break')phase=1;
  if(c.state==='done')phase=3;
  if(reportDone)phase=4;
  document.querySelectorAll('#steps .stp').forEach((el,i)=>{el.classList.toggle('done',i<phase);el.classList.toggle('now',i===phase)});
  const map={
    none:['READY','Check In',false],
    working:['ON DUTY','Working…',true],
    break:['ON BREAK','Resume Work',false],
    done:['SHIFT ENDED','Submit report below ↓',true]
  };
  const m=reportDone?['SEE YOU NEXT TIME','Done ✓',true]:map[c.state];
  $('bigT1').textContent=m[0];$('bigT2').textContent=m[1];$('bigBtn').disabled=m[2];
  $('btnBreak').disabled=c.state!=='working';
  $('btnFinish').disabled=!(c.state==='working'||c.state==='break');
  $('elapsed').classList.toggle('hide',!(c.state==='working'||c.state==='break'));
  $('elV').textContent=Math.floor(c.workedMin/60)+':'+String(c.workedMin%60).padStart(2,'0');
  $('elS').textContent=c.state==='break'?'☕ On break':'● On duty';
  $('taskCard').classList.toggle('hide',c.state==='none'||reportDone);
  $('photoBtn').classList.toggle('hide',!(c.state==='done'));
  const allTasks=tasksState.length===0||tasksState.every(x=>x.done);
  $('submitBtn').classList.toggle('hide',!(c.state==='done'&&!reportDone));
  $('submitBtn').disabled=!(allTasks&&photoData);
  $('doneBox').classList.toggle('hide',!reportDone);
  if(reportDone)$('doneSum').textContent='Worked '+minToH(c.workedMin)+' ・ Break '+c.breakMin+'min ・ Report ✓';
}

/* ---------- chat (LINE style) ---------- */
function renderChat(msgs){
  msgs.sort((a,b)=>(a.at?.toMillis?.()||9e15)-(b.at?.toMillis?.()||9e15));
  $('chatBox').innerHTML=msgs.map(m=>{
    const mine=m.from==='staff';
    if(mine){
      return `<div class="mrow me"><span class="tm">${hm(m.at)}</span><div class="bub">${esc(m.text)}</div></div>`;
    }
    const tr=`<div class="trrow"><a class="tr" target="_blank" href="https://translate.google.com/?sl=auto&tl=en&text=${encodeURIComponent(m.text)}&op=translate">🌐 EN translate</a></div>`;
    return `<div><div class="sender">Hachi Office</div>
      <div class="mrow them"><img class="avy" src="icons/mark-160.png" alt=""><div class="bub">${esc(m.text)}</div><span class="tm">${hm(m.at)}</span></div>${tr}</div>`;
  }).join('');
  window.scrollTo(0,document.body.scrollHeight);
  const hq=msgs.filter(m=>m.from==='hq').length;
  const v=$('vChat').classList.contains('hide');
  if(v&&hq>lastChatSeen&&lastChatSeen>0){$('unread').textContent=hq-lastChatSeen;$('unread').classList.remove('hide')}
  if(!v)lastChatSeen=hq;
  if(lastChatSeen===0)lastChatSeen=hq;
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('sendBtn').onclick=async()=>{
  const t=$('msgIn').value.trim();if(!t)return;
  $('msgIn').value='';
  try{await db.collection('messages').add({uid:me.uid,from:'staff',fromName:meDoc.name||'',text:t,at:TS()})}
  catch(e){toast('Send failed');console.error(e)}
};
$('msgIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});

/* ---------- tabs ---------- */
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const v=b.dataset.v;
  $('vHome').classList.toggle('hide',v!=='Home');
  $('vChat').classList.toggle('hide',v!=='Chat');
  $('chatbar').classList.toggle('hide',v!=='Chat');
  if(v==='Chat'){$('unread').classList.add('hide');lastChatSeen=0;/* reset on open */ window.scrollTo(0,document.body.scrollHeight);}
});
</script>
