<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F2E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hachi Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Hachi Life Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2E6;--paper:#FFFDF8;--cream:#F2EAD6;
  --line:#EAE0C8;--line2:#DCCfA9;
  --ink:#2A2118;--mut:#7A6A52;--mut2:#A79878;
  --gold:#B98A2F;--honey:#E9A13B;--honey2:#F2C14E;
  --grn:#3E9D63;--red:#D95B3E;
  --disp:"Cormorant Garamond",Georgia,serif;
  --shadow:0 1px 2px rgba(42,33,24,.05),0 10px 30px rgba(42,33,24,.07);
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:14px;line-height:1.7;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background-image:radial-gradient(90% 40% at 50% -6%, rgba(242,193,78,.18) 0%, rgba(242,193,78,0) 70%);
  background-repeat:no-repeat}
.hide{display:none!important}
.wrap{max-width:430px;margin:0 auto;padding:0 18px}
button{font-family:inherit}

/* ===== login ===== */
#login{max-width:360px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top)) 26px 60px;text-align:center}
#login .appicon{width:92px;height:92px;border-radius:24px;margin:0 auto 20px;display:block;
  box-shadow:0 18px 40px rgba(42,33,24,.22),0 2px 6px rgba(42,33,24,.12)}
#login h1{font-family:var(--disp);font-weight:600;font-size:34px;letter-spacing:1.5px;margin:0;color:var(--ink)}
#login .sub{color:var(--gold);font-size:10.5px;letter-spacing:4px;font-weight:900;margin:4px 0 34px}
#login input{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:15px;font-size:16px;
  margin-bottom:12px;background:var(--paper);color:var(--ink);outline:none;font-family:inherit;
  box-shadow:inset 0 1px 2px rgba(42,33,24,.03)}
#login input::placeholder{color:var(--mut2)}
#login input:focus{border-color:var(--honey);box-shadow:0 0 0 3px rgba(233,161,59,.15)}
#login button{width:100%;padding:17px;border:none;border-radius:16px;margin-top:8px;
  background:linear-gradient(180deg,var(--honey2),var(--honey));
  color:#3A2706;font-size:15px;font-weight:900;letter-spacing:1.5px;cursor:pointer;
  box-shadow:0 10px 24px rgba(233,161,59,.35),inset 0 1px 0 rgba(255,255,255,.5)}
#login button:active{transform:scale(.98)}
#loginErr{color:var(--red);font-size:12.5px;min-height:20px;margin-top:12px}

/* ===== header ===== */
.topbar{position:sticky;top:0;z-index:20;
  background:rgba(247,242,230,.82);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid rgba(220,207,169,.4)}
.topbar .in{max-width:430px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:center;gap:10px}
.topbar img{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(42,33,24,.18))}
.topbar .brand{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.5px;color:var(--ink);line-height:1.05}
.topbar .brand small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:8px;font-weight:900;letter-spacing:3.5px;color:var(--gold)}
.topbar .sp{flex:1}
.topbar .dt{font-size:10px;font-weight:900;color:var(--mut2);letter-spacing:1.2px}

.hi{font-size:23px;font-weight:900;margin:18px 0 2px}

/* ===== cards ===== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:17px 18px;margin-top:14px;box-shadow:var(--shadow)}
.lb{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.visit{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.visit .fam{font-weight:900;font-size:18px}
.visit .loc{font-size:11.5px;color:var(--mut)}
.timechip{background:#FFF7E2;border:1px solid #F2DCA4;color:#8A6410;
  font-size:11.5px;font-weight:900;padding:8px 13px;border-radius:12px;white-space:nowrap;text-align:center}
.steps{display:flex;gap:5px;margin-top:16px}
.stp{flex:1;text-align:center;font-size:9.5px;font-weight:700;color:var(--mut2);padding-top:8px}
.stp::before{content:"";display:block;height:4px;border-radius:99px;background:var(--cream);margin-bottom:6px}
.stp.done{color:var(--gold)}.stp.done::before{background:linear-gradient(90deg,var(--honey),var(--honey2))}
.stp.now{color:var(--ink)}.stp.now::before{background:var(--ink)}

/* ===== big button ===== */
.big{margin-top:16px;border:none;width:100%;border-radius:22px;padding:19px 22px;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,var(--honey2) 0%,var(--honey) 100%);
  box-shadow:0 12px 28px rgba(233,161,59,.38),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(140,95,15,.25);
  display:flex;align-items:center;justify-content:space-between;transition:transform .12s}
.big:active{transform:scale(.97)}
.big:disabled{opacity:.45;box-shadow:none}
.big .t1{font-size:10px;font-weight:900;letter-spacing:2.5px;color:#7A5408}
.big .t2{font-size:22px;font-weight:900;color:#2A1D07;margin-top:2px}
.big .play{width:50px;height:50px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;color:var(--honey2);
  box-shadow:0 4px 10px rgba(42,33,24,.3)}
.big .play svg{width:20px;height:20px;fill:var(--honey2)}
.subrow{display:flex;gap:10px;margin-top:12px}
.sb{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px 0;text-align:center;
  font-weight:900;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 1px 2px rgba(42,33,24,.05),0 4px 12px rgba(42,33,24,.05);transition:transform .12s}
.sb:active{transform:scale(.97)}
.sb:disabled{opacity:.35}
.sb svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.elapsed{margin-top:13px;background:var(--ink);border-radius:20px;padding:15px 20px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 14px 30px rgba(42,33,24,.25)}
.elapsed .l{font-size:9px;font-weight:900;letter-spacing:2.5px;color:#C9A85C}
.elapsed .v{font-family:var(--disp);font-size:36px;font-weight:600;color:var(--honey2);font-variant-numeric:tabular-nums;line-height:1.1}
.elapsed .st2{font-size:11px;font-weight:900;color:#B5A585}

/* ===== tasks ===== */
.task .row{display:flex;align-items:center;gap:12px;padding:11px 0;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;user-select:none;border-bottom:1px solid #F4EDDC}
.task .row:last-of-type{border-bottom:none}
.ck{width:24px;height:24px;border-radius:9px;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:all .15s}
.ck svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.on .ck{background:linear-gradient(180deg,var(--honey2),var(--honey));border-color:var(--honey);box-shadow:0 3px 8px rgba(233,161,59,.35)}
.row.on .ck svg{opacity:1;stroke:#3A2706}
.row.on{color:var(--mut2);text-decoration:line-through}
.photo{display:flex;align-items:center;gap:10px;margin-top:12px;background:#FFF7E2;border:1.5px dashed #E8CD8C;border-radius:14px;padding:13px 14px;font-weight:700;font-size:12.5px;color:#8A6410;cursor:pointer}
.photo.on{border-style:solid;background:#EDF7EF;border-color:#B2D9BE;color:var(--grn)}
.photo img{width:44px;height:44px;object-fit:cover;border-radius:10px}
.donebox{margin-top:14px;background:#EDF7EF;border:1px solid #CBE5D3;border-radius:22px;padding:20px;text-align:center}
.donebox b{display:block;font-size:16px;margin-top:4px;color:#2C7A4B}
.donebox p{margin:6px 0 0;font-size:12px;color:#5E8A6D}

/* ===== chat ===== */
.chathead{display:flex;align-items:center;gap:11px;padding:14px 2px 12px}
.chathead .avw{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,var(--honey2),var(--honey));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(233,161,59,.3)}
.chathead .avw img{width:34px;height:34px}
.chathead .n{font-weight:900;font-size:15px}
.chathead .s{font-size:10.5px;color:var(--mut)}
#chatBox{display:flex;flex-direction:column;padding:4px 0 12px}
.mrow{display:flex;align-items:flex-end;gap:7px;margin-top:10px}
.mrow.me{justify-content:flex-end}
.mrow .avy{width:30px;height:30px;border-radius:50%;flex:none;background:linear-gradient(180deg,var(--honey2),var(--honey));padding:4px;box-sizing:border-box;align-self:flex-start}
.bub{max-width:74%;padding:10px 14px;font-size:13.5px;line-height:1.6;word-break:break-word}
.mrow.them .bub{background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:4px 18px 18px 18px;box-shadow:0 2px 8px rgba(42,33,24,.06)}
.mrow.me .bub{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#2A1D07;font-weight:500;border-radius:18px 4px 18px 18px;box-shadow:0 4px 12px rgba(233,161,59,.3)}
.bub .tr2{display:block;margin-top:7px;padding-top:7px;font-size:12px;line-height:1.55}
.mrow.them .bub .tr2{border-top:1px solid #F0E8D2;color:var(--mut)}
.mrow.me .bub .tr2{border-top:1px solid rgba(58,39,6,.18);color:#6E5213}
.tm{font-size:9.5px;color:var(--mut2);flex:none;padding-bottom:2px}
.sender{font-size:10px;color:var(--mut2);margin:0 0 3px 44px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:19;
  background:linear-gradient(180deg,rgba(247,242,230,0),rgba(247,242,230,.95) 35%);padding:16px 16px 10px;display:flex;gap:9px}
.chatbar .inwrap{flex:1;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 10px rgba(42,33,24,.08)}
.chatbar input{flex:1;padding:13px 19px;border:none;border-radius:999px;font-size:16px;background:transparent;color:var(--ink);outline:none;font-family:inherit}
.chatbar input::placeholder{color:var(--mut2)}
.chatbar button{border:none;border-radius:50%;width:48px;height:48px;flex:none;
  background:linear-gradient(180deg,var(--honey2),var(--honey));cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(233,161,59,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.chatbar button:active{transform:scale(.94)}
.chatbar button svg{width:19px;height:19px;fill:#3A2706}
.trnote{font-size:10px;color:var(--mut2);text-align:center;margin:8px 0 0}

/* ===== tabs ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:rgba(255,253,248,.88);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid rgba(220,207,169,.45);display:flex;padding:9px 6px calc(16px + env(safe-area-inset-bottom))}
.nav button{flex:1;text-align:center;font-size:9.5px;font-weight:900;color:var(--mut2);letter-spacing:1.2px;border:none;background:none;cursor:pointer;position:relative}
.nav .ic{display:block;margin:0 auto 3px;width:24px;height:24px;stroke:var(--mut2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:all .15s}
.nav button.on{color:var(--gold)}
.nav button.on .ic{stroke:var(--gold)}
.badge{position:absolute;top:-3px;right:calc(50% - 23px);min-width:17px;background:var(--red);color:#fff;border-radius:99px;font-size:9px;font-weight:900;padding:2px 5px;box-shadow:0 2px 6px rgba(217,91,62,.4)}
.toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--honey2);font-weight:900;font-size:13px;padding:13px 24px;border-radius:999px;
  box-shadow:0 14px 34px rgba(42,33,24,.35);z-index:99;transition:opacity .3s;white-space:nowrap}
.out{margin-top:18px;text-align:center}
.out button{background:none;border:none;color:var(--mut2);font-size:11.5px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <img class="appicon" src="icons/icon-192.png" alt="">
  <h1>Hachi Life</h1>
  <p class="sub">STAFF APP</p>
  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Sign In</button>
  <p id="loginErr"></p>
</div>

<!-- APP -->
<div id="app" class="hide">
<div class="topbar"><div class="in">
  <img src="icons/mark-160.png" alt="">
  <div class="brand">Hachi Life<small>STAFF APP</small></div>
  <div class="sp"></div>
  <div class="dt" id="dt"></div>
</div></div>

<div class="wrap">
  <!-- HOME -->
  <div id="vHome">
    <div class="hi" id="hi">Hi 👋</div>
    <div class="card">
      <div class="lb">TODAY'S FAMILY</div>
      <div class="visit">
        <div><div class="fam" id="cName">—</div><div class="loc" id="cArea"></div></div>
        <div class="timechip" id="cTime">—</div>
      </div>
      <div class="steps" id="steps">
        <div class="stp" data-s="0">Check In</div><div class="stp" data-s="1">Work</div><div class="stp" data-s="2">Tasks</div><div class="stp" data-s="3">Report</div><div class="stp" data-s="4">Done</div>
      </div>
    </div>

    <button class="big" id="bigBtn"><span><span class="t1" id="bigT1">READY</span><span class="t2" id="bigT2" style="display:block">Check In</span></span><span class="play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span></button>
    <div class="subrow">
      <button class="sb" id="btnBreak" disabled><svg viewBox="0 0 24 24"><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M8 2.5v2M11.5 2.5v2"/></svg>Break</button>
      <button class="sb" id="btnFinish" disabled><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>Finish</button>
    </div>

    <div class="elapsed hide" id="elapsed">
      <div><div class="l">WORKING TIME</div><div class="v" id="elV">0:00</div></div>
      <div class="st2" id="elS">● On duty</div>
    </div>

    <div class="card task hide" id="taskCard">
      <div class="lb">FAMILY BOOK ・ TODAY'S TASKS</div>
      <div id="taskList"></div>
      <label class="photo hide" id="photoBtn">
        <input type="file" accept="image/*" capture="environment" id="photoIn" style="display:none">
        <span id="photoIc">📷</span><span id="photoT">Take photo of locked door</span>
      </label>
      <button class="big hide" id="submitBtn" style="margin-top:12px;padding:16px 20px"><span><span class="t1">ALL DONE?</span><span class="t2" style="display:block;font-size:18px">Submit Report</span></span><span class="play"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:#F2C14E"/></svg></span></button>
    </div>

    <div class="donebox hide" id="doneBox">
      <div style="font-size:28px">🎉</div><b>Great work today!</b>
      <p id="doneSum"></p>
    </div>
    <div class="out"><button id="logout">Sign out</button></div>
  </div>

  <!-- CHAT -->
  <div id="vChat" class="hide">
    <div class="chathead">
      <div class="avw"><img src="icons/mark-160.png" alt=""></div>
      <div><div class="n">Hachi Life Office</div><div class="s">Messages are translated automatically 🌐</div></div>
    </div>
    <div id="chatBox"></div>
  </div>
</div>

<div class="chatbar hide" id="chatbar">
  <div class="inwrap"><input id="msgIn" placeholder="Message in English is OK!"></div>
  <button id="sendBtn"><svg viewBox="0 0 24 24"><path d="M3.4 20.4 21.8 12 3.4 3.6 3.4 10.2 16 12 3.4 13.8z"/></svg></button>
</div>

<div class="nav">
  <button class="on" data-v="Home">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
    HOME</button>
  <button data-v="Chat">
    <svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5c0 4.14-4.03 7.5-9 7.5-1.03 0-2.02-.14-2.94-.41L4 20l1.28-3.42C3.86 15.3 3 13.49 3 11.5 3 7.36 7.03 4 12 4s9 3.36 9 7.5Z"/></svg>
    CHAT<span class="badge hide" id="unread">0</span></button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
let me=null, meDoc=null, punches=[], tasksState=[], photoData=null, reportDone=false, timer=null, lastChatSeen=0;
const $=id=>document.getElementById(id);

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),400)},1800)}

/* ---------- login ---------- */
$('loginBtn').onclick=async()=>{
  $('loginErr').textContent='';
  try{ await auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value); }
  catch(e){ $('loginErr').textContent='Sign in failed. Check email / password.'; }
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});

auth.onAuthStateChanged(async u=>{
  if(!u){ $('login').classList.remove('hide'); $('app').classList.add('hide'); return; }
  me=u;
  const snap=await db.collection('staff').doc(u.uid).get();
  if(!snap.exists){ $('loginErr').textContent='No staff profile. Contact the office.'; auth.signOut(); return; }
  meDoc=snap.data();
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  boot();
});
$('logout').onclick=()=>auth.signOut();

/* ---------- boot ---------- */
function boot(){
  const n=new Date();
  $('dt').textContent=['SUN','MON','TUE','WED','THU','FRI','SAT'][n.getDay()]+', '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][n.getMonth()]+' '+n.getDate();
  $('hi').textContent='Hi, '+(meDoc.name||'Staff')+' 👋';
  $('cName').textContent=meDoc.clientName||'No assignment';
  $('cArea').textContent=meDoc.clientArea||'';
  $('cTime').textContent=meDoc.schedule||'';
  tasksState=(meDoc.tasks||[]).map(t=>({t,done:false}));
  renderTasks();
  // 今日の打刻を購読
  db.collection('punches').where('uid','==',me.uid).where('day','==',todayStr())
    .onSnapshot(s=>{punches=s.docs.map(d=>d.data());render()},e=>console.error(e));
  // 今日の日報があるか
  db.collection('reports').doc(todayStr()+'_'+me.uid).onSnapshot(s=>{
    reportDone=s.exists; render();
  });
  // chat購読
  db.collection('messages').where('uid','==',me.uid)
    .onSnapshot(s=>{renderChat(s.docs.map(d=>d.data()))},e=>console.error(e));
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{const c=calcDay(punches);if(c.state==='working'||c.state==='break'){$('elV').textContent=Math.floor(c.workedMin/60)+':'+String(c.workedMin%60).padStart(2,'0')}},20000);
}

/* ---------- punch ---------- */
let punchLock=false; // 連打防止
async function punch(type){
  if(punchLock)return; punchLock=true; setTimeout(()=>{punchLock=false},2000);
  let geo=null;
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000,maximumAge:60000}));
    geo={lat:pos.coords.latitude,lng:pos.coords.longitude};
  }catch(e){}
  await db.collection('punches').add({
    uid:me.uid,name:meDoc.name||'',day:todayStr(),type,at:TS(),
    lat:geo?geo.lat:null,lng:geo?geo.lng:null
  });
}
$('bigBtn').onclick=async()=>{
  const c=calcDay(punches);
  try{
    if(reportDone)return;
    if(c.state==='none'){await punch('in');toast('Checked in! Have a good day 🐝');}
    else if(c.state==='break'){await punch('be');toast('Back to work!');}
    else if(c.state==='done'){ /* submit flow handled by submitBtn */ }
  }catch(e){toast('Error. Try again.');console.error(e)}
};
$('btnBreak').onclick=()=>punch('bs').then(()=>toast('Break ☕')).catch(()=>toast('Error'));
$('btnFinish').onclick=async()=>{
  const c=calcDay(punches);
  if(c.state==='none'||c.state==='done')return; // 未出勤・退勤済みは無視
  if(c.state==='break'){punchLock=false;await punch('be');}
  punchLock=false;await punch('out');toast('Finished! Please submit your report.');
};
/* ---------- tasks / photo / report ---------- */
function renderTasks(){
  $('taskList').innerHTML=tasksState.map((x,i)=>`<div class="row ${x.done?'on':''}" data-i="${i}"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></span>${x.t}</div>`).join('')||'<div style="color:var(--mut);font-size:12px">No tasks set. Ask the office.</div>';
  document.querySelectorAll('#taskList .row').forEach(r=>r.onclick=()=>{tasksState[+r.dataset.i].done=!tasksState[+r.dataset.i].done;renderTasks();render()});
}
$('photoIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');
    const sc=Math.min(1,900/Math.max(img.width,img.height));
    cv.width=img.width*sc;cv.height=img.height*sc;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    photoData=cv.toDataURL('image/jpeg',0.65);
    if(photoData.length>900000){photoData=cv.toDataURL('image/jpeg',0.4);}
    $('photoBtn').classList.add('on');$('photoIc').innerHTML='<img src="'+photoData+'">';$('photoT').textContent='Lock photo ready ✓';
    render();
  };
  img.src=URL.createObjectURL(f);
};
$('submitBtn').onclick=async()=>{
  const c=calcDay(punches);
  const tasksObj={};tasksState.forEach((x,i)=>tasksObj[i]=x.done);
  try{
    await db.collection('reports').doc(todayStr()+'_'+me.uid).set({
      uid:me.uid,name:meDoc.name||'',day:todayStr(),client:meDoc.clientName||'',
      tasks:(meDoc.tasks||[]),tasksDone:tasksObj,photo:photoData||null,
      workedMin:c.workedMin,breakMin:c.breakMin,submittedAt:TS()
    });
    toast('Report sent! 🎉');
  }catch(e){toast('Error sending report');console.error(e)}
};

/* ---------- render ---------- */
function render(){
  const c=calcDay(punches);
  let phase=0;
  if(c.state==='working')phase=tasksState.some(x=>x.done)?2:1;
  if(c.state==='break')phase=1;
  if(c.state==='done')phase=3;
  if(reportDone)phase=4;
  document.querySelectorAll('#steps .stp').forEach((el,i)=>{el.classList.toggle('done',i<phase);el.classList.toggle('now',i===phase)});
  const map={
    none:['READY','Check In',false],
    working:['ON DUTY','Working…',true],
    break:['ON BREAK','Resume Work',false],
    done:['SHIFT ENDED','Submit report below ↓',true]
  };
  const m=reportDone?['SEE YOU NEXT TIME','Done ✓',true]:map[c.state];
  $('bigT1').textContent=m[0];$('bigT2').textContent=m[1];$('bigBtn').disabled=m[2];
  $('btnBreak').disabled=c.state!=='working';
  $('btnFinish').disabled=!(c.state==='working'||c.state==='break');
  $('elapsed').classList.toggle('hide',!(c.state==='working'||c.state==='break'));
  $('elV').textContent=Math.floor(c.workedMin/60)+':'+String(c.workedMin%60).padStart(2,'0');
  $('elS').textContent=c.state==='break'?'☕ On break':'● On duty';
  $('taskCard').classList.toggle('hide',c.state==='none'||reportDone);
  $('photoBtn').classList.toggle('hide',!(c.state==='done'));
  const allTasks=tasksState.length===0||tasksState.every(x=>x.done);
  $('submitBtn').classList.toggle('hide',!(c.state==='done'&&!reportDone));
  $('submitBtn').disabled=!(allTasks&&photoData);
  $('doneBox').classList.toggle('hide',!reportDone);
  if(reportDone)$('doneSum').textContent='Worked '+minToH(c.workedMin)+' ・ Break '+c.breakMin+'min ・ Report ✓';
}

/* ---------- chat ---------- */
function renderChat(msgs){
  msgs.sort((a,b)=>(a.at?.toMillis?.()||9e15)-(b.at?.toMillis?.()||9e15));
  $('chatBox').innerHTML=msgs.map(m=>{
    const mine=m.from==='staff';
    const tr2=m.textTr?`<span class="tr2">${esc(m.textTr)}</span>`:'';
    if(mine){
      return `<div class="mrow me"><span class="tm">${hm(m.at)}</span><div class="bub">${esc(m.text)}${tr2}</div></div>`;
    }
    return `<div><div class="sender">Hachi Office</div>
      <div class="mrow them"><img class="avy" src="icons/mark-160.png" alt=""><div class="bub">${esc(m.text)}${tr2}</div><span class="tm">${hm(m.at)}</span></div></div>`;
  }).join('');
  window.scrollTo(0,document.body.scrollHeight);
  const hq=msgs.filter(m=>m.from==='hq').length;
  const v=$('vChat').classList.contains('hide');
  if(v&&hq>lastChatSeen&&lastChatSeen>0){$('unread').textContent=hq-lastChatSeen;$('unread').classList.remove('hide')}
  if(!v)lastChatSeen=hq;
  if(lastChatSeen===0)lastChatSeen=hq;
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('sendBtn').onclick=async()=>{
  const t=$('msgIn').value.trim();if(!t)return;
  $('msgIn').value='';
  try{
    const tr=await autoTranslate(t); // 原文＋自動翻訳の両方を保存
    await db.collection('messages').add({uid:me.uid,from:'staff',fromName:meDoc.name||'',text:t,textTr:tr||null,at:TS()});
  }catch(e){toast('Send failed');console.error(e)}
};
$('msgIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});

/* ---------- tabs ---------- */
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const v=b.dataset.v;
  $('vHome').classList.toggle('hide',v!=='Home');
  $('vChat').classList.toggle('hide',v!=='Chat');
  $('chatbar').classList.toggle('hide',v!=='Chat');
  if(v==='Chat'){$('unread').classList.add('hide');lastChatSeen=0;/* reset on open */ window.scrollTo(0,document.body.scrollHeight);}
});
</script>
</body>
</html>
